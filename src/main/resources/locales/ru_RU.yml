# Не удалять настройку version.
version: 1.3

# Сообщения.
messages:
  # Действия (Actions):
  # [actionbar] сообщение - Отправляет actionbar с вашим сообщением. Для 1.11+
  # [connect] сервер - Отправляет игрока на указанный сервер BungeeCord.
  # ВНИМАНИЕ: Требует BungeeMessaging. Присутствует в BungeeCord и WaterFall.
  # На Velocity это может быть отключено по умолчанию. Проверьте конфигурацию вашего прокси.
  # [message] сообщение - Отправляет сообщение игроку.
  # [room] сообщение - Отправляет сообщение всем игрокам в комнате.
  # [broadcast] сообщение - Отправляет сообщение всем игрокам на сервере.
  # [log] сообщение - Отправляет сообщение в консоль.
  # [delay] тики - Создает задержку между действиями. В тиках (20 тиков = 1 секунда).
  # [player] сообщение - Отправляет сообщение от имени игрока (или выполняет команду через /).
  # [teleport] мир;x;y;z;yaw;pitch;задержка - Телепортирует игрока на указанные координаты. Задержка измеряется в тиках.
  # [console] команда - Выполняет команду от имени консоли сервера.
  # [title] заголовок;подзаголовок;появление;задержка;исчезновение - Отправляет title игроку. Для 1.8+
  # [sound] звук;громкость;высота(pitch);задержка - Проигрывает звук для игрока. Задержка измеряется в тиках.
  # Ищите названия звуков здесь: https://helpch.at/docs/$version$/org/bukkit/Sound.html
  # // Замените $version$ на версию вашего сервера, например: https://helpch.at/docs/1.8.8/org/bukkit/Sound.html
  # [effect] тип;длительность;сила;задержка - Выдает эффект зелья игроку. Задержка и длительность измеряются в тиках.
  # Найти типы эффектов можно здесь: https://helpch.at/docs/$version$/org/bukkit/potion/PotionEffectType.html
  # [explosion] сила;поджог;разрушениеБлоков;задержка;addX;addY;addZ - Создает взрыв. Задержка измеряется в тиках.
  # поджог (setFire), разрушениеБлоков (breakBlocks) - укажите false или true. addX, addY, addZ - значения типа double, которые смещают центр взрыва относительно игрока.
  # [bossbar] сообщение;цвет;тип;время;стиль;флаг - Отправляет bossbar (полосу босса) игроку с сообщением на определенное время. Для 1.9+
  # Типы:
  # stop - Bossbar исчезнет через время, которое вы указали в параметре время (в секундах).
  # time - Bossbar будет анимировать истекающее время.
  # Функции:
  # %time% - Осталось секунд.
  # Вы можете найти все параметры (цвет, стиль и флаги) здесь: https://helpch.at/docs/$version$/org/bukkit/boss/BossBar.html
  #
  # Плейсхолдеры:
  # %hvsv_role% - Отображает роль игрока.
  # %hvsv_map% - Отображает название карты.
  # %hvsv_id% - Отображает ID карты.
  # %hvsv_status% - Отображает статус карты.
  # %hvsv_online% - Отображает количество игроков онлайн в этой игре.
  # %hvsv_maxonline% - Отображает максимальное количество игроков онлайн в этой игре.
  #
  # Сообщения от HvsV (Hunters vs Victims)
  game:
    # Вы не можете использовать действия (actions) в статусах, ролях и плейсхолдерах.
    status:
      wait: "&fЗапуск через: &e%time% &fсек."
      start: "&fДо конца игры: &e%time%"
      stopped: "&fНужно игроков: &e%min_players%"
      winVictim: "&aЖертвы победили!"
      winHunter: "&cОхотники победили!"
    role:
      victim: "&aЖертва"
      hunter: "&cОхотник"
    actions:
      command:
        help:
          - "[message] &a[HVSV] Помощь &7(/hvsv help):"
          - "[message] &f"
          - "[message] &a/hvsv status &f- Посмотреть статус плагина."
          - "[message] &a/hvsv join &f- Создать или присоединиться к любой доступной комнате."
          - "[message] &a/hvsv join IDкомнаты &f- Попытка подключиться к комнате (если она доступна)."
          - "[message] &a/hvsv exit &f- Покинуть комнату."
          - "[message] &a/hvsv admin &f- Получить помощь по администрированию."
          - "[message] &a/hvsv reload &f- Перезагрузить конфигурацию плагина."
          - "[message] &f"
        noperm:
          - "[message] &cУ вас недостаточно прав!"
      room:
        notfound:
          - "[message] &cЭтой карты не существует."
        started:
          - "[message] &cИгра уже началась."
        connect:
          - "[message] &aПодключение к комнате &e%room%..."
        waiter:
          - "[message] &aВы были помещены в очередь."
          - "[message] &fПокинуть очередь: &c/hvsv exit"
        exit:
          - "[message] &cВы покинули очередь."
        noExit:
          - "[message] &cВы не находитесь в игре."
      game:
        inGame:
          - "[message] &cВы уже в игре!"
        end:
          - "[message] &cИгра окончена."
        kicked:
          - "[message] &cВас исключили из игры."
        join:
          - "[message] &aВы подключены к игре: &e%game%"
          - "[room] &aИгрок &e%player% &aприсоединился к игре &f(&e%amount%&f/&e%max_players%&f)"
        quit:
          - "[room] &cИгрок &e%player% &cпокинул игру &f(&e%amount%&f/&e%max_players%&f)"
        role:
          - "[message] &fВы %role%!"
          - "[title] &fРоль:;%role%"
          - "[message] &cОхотники &fскоро выйдут. Спешите спрятаться!"
        killHunter:
          - "[message] &fЖертва &a%victim% &cнейтрализовала&f охотника &c%hunter%"
        killVictim:
          - "[message] &fОхотник &c%hunter% &cубил&f жертву &a%victim%"
        exitHun:
          - "[message] &cОхотники &fвырвались из заточения!"
          - "[title] &cОхотники;&aОни на свободе!"
        startAxe:
          - "[message] &aТопор&f появился!"
          - "[title] &aТопор;&fпоявился!"
        getAxe:
          - "[message] &fИгрок &e%axe% &fподобрал топор! &cБегите, охотники!"
        winHunter:
          - "[message] &cОхотники победили!"
          - "[title] &cОхотники;&fпобедили!"
        winVictim:
          - "[message] &aЖертвы победили!"
          - "[title] &aЖертвы;&fпобедили!"